<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Money Graph · приоритет проверки</title>
  <style>
    :root{color-scheme:dark;--bg:#0c141b;--panel:#14212b;--line:#2a3c48;--text:#e9f0f4;--muted:#9bb0bd;--accent:#67d3c4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
    header{padding:17px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--line)}
    h1{font-size:20px;margin:0;letter-spacing:-.5px}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #4b7e82;border-radius:11px;color:var(--accent);font-weight:750}
    #stats{color:var(--muted);text-align:right;font-size:13px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:11px 22px;background:#101c25}
    input,select,button{font:inherit;color:var(--text);background:#14242f;border:1px solid #3b5363;border-radius:7px;padding:8px 10px}button{cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    #search{width:285px;background:#0b151e}#find{background:#285d5a;border-color:#407e76}label{color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:minmax(0,1fr) 375px;height:calc(100vh - 145px);min-height:540px}
    #view{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at center,#15242f 0,#0c151d 72%)}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas.dragging{cursor:grabbing}
    .graph-heading{position:absolute;left:20px;top:17px;pointer-events:none;max-width:80%}.graph-heading strong{font-size:15px}.graph-heading small{display:block;color:var(--muted);margin-top:3px}
    #legend{position:absolute;left:18px;bottom:43px;display:flex;flex-wrap:wrap;gap:7px 12px;max-width:90%;background:#0c151de6;padding:8px 10px;border-radius:8px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.hint{position:absolute;bottom:13px;left:20px;color:#8298a6;font-size:11px;pointer-events:none}
    #tooltip{position:absolute;display:none;pointer-events:none;background:#1d3546;border:1px solid #537387;border-radius:7px;padding:7px 9px;z-index:3;font-size:12px;white-space:pre-line}.side{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:18px}.side h2{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}.side h3{font-size:13px;margin:15px 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.badge{padding:3px 7px;border-radius:5px;background:#253a48;font-size:12px}
    .scoreline{display:flex;gap:20px;margin:14px 0}.scoreline strong{font-size:23px;display:block}.scoreline span{font-size:11px;color:var(--muted)}.evidence{background:#0c1821;border-left:2px solid var(--accent);padding:10px 11px;border-radius:4px;font-size:12px;color:#cddce5;margin:10px 0}.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.flow>div{background:#1a2c39;border-radius:6px;padding:8px;font-size:12px}.flow b{display:block;font-size:13px;margin-top:3px}.in{color:#84c9e9}.out{color:#f4b08c}
    details{border-top:1px solid var(--line);margin-top:13px;padding-top:10px}summary{cursor:pointer;color:#c3d4df;font-size:12px}details p{font-size:12px;color:var(--muted)}.metrics{font-size:11px;border-collapse:collapse;width:100%;margin:8px 0}.metrics th,.metrics td{text-align:left;padding:4px;border-bottom:1px solid #263b49}.connections{max-height:240px;overflow:auto;margin-top:8px}.connection{display:block;width:100%;text-align:left;margin-bottom:5px;border:0;background:#1a2d3b;padding:7px 8px;font-size:11px}.connection b{font-size:12px;font-weight:500;display:block}.toplist{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}.rank{display:grid;grid-template-columns:25px 1fr 39px;width:100%;text-align:left;align-items:center;gap:5px;border:0;border-bottom:1px solid #2b3e4a;border-radius:0;background:transparent;padding:9px 1px;font-size:12px}.rank small{display:block;color:var(--muted);margin-top:2px}.rank.active{color:var(--accent)}#status{color:#f3cc90;font-size:12px;margin-left:auto;max-width:300px}.note{font-size:11px;color:#91a9b8;margin:14px 0}
    @media(max-width:950px){main{grid-template-columns:1fr;height:auto;min-height:0}#view{height:65vh;min-height:450px}.side{border-left:0;border-top:1px solid var(--line);max-height:none}header{padding:12px}#stats{font-size:11px}.toolbar{padding:10px 12px}#search{width:230px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">MG</div><div><h1>Money Graph</h1><p>Кого проверить первым — и почему</p></div></div><div id="stats"></div></header>
  <div class="toolbar">
    <input id="search" type="search" inputmode="numeric" aria-label="Поиск по gid" placeholder="Введите полный gid">
    <button id="find">Найти</button>
    <select id="color" aria-label="Раскраска графа"><option value="role">Цвет: роль</option><option value="cluster">Цвет: кластер</option></select>
    <select id="cluster" aria-label="Выбор кластера"><option value="all">Все кластеры</option></select>
    <button id="overview">Вся сеть</button><span id="status" role="status" aria-live="polite"></span>
  </div>
  <main>
    <section id="view"><div class="graph-heading"><strong id="graphTitle">Прямые связи</strong><small id="graphSubtitle"></small></div><canvas id="graph" aria-label="Направленный граф переводов"></canvas><div id="tooltip"></div><div id="legend"></div><div class="hint">Плательщик → получатель · колесо: масштаб · перетаскивание: панорама · клик: карточка</div></section>
    <aside class="side"><div id="detail"></div><p class="note">Роли — гипотезы по наблюдаемым переводам. Оценка роли отражает силу правила, а не вероятность вины.</p><div class="toplist"><h3>Первые 10 для проверки</h3><div id="toplist"></div></div></aside>
  </main>
  <script id="payload" type="application/json">__DATA__</script>
  <script>
    'use strict';
    const data=JSON.parse(document.getElementById('payload').textContent);
    const {nodes,edges,roleColors,thresholds:T}=data;
    const el=id=>document.getElementById(id),canvas=el('graph'),ctx=canvas.getContext('2d'),view=el('view');
    const roleNames={consolidator:'Консолидация',transit:'Транзит',distributor:'Распределение',terminal:'Получатель',coordinator:'Координация',peripheral:'Периферия'};
    const gidIndex=new Map(nodes.map((n,i)=>[n.gid,i]));
    const incoming=nodes.map(()=>[]),outgoing=nodes.map(()=>[]),groups=new Map(),pairs=new Set();
    edges.forEach((e,i)=>{incoming[e.dst].push(i);outgoing[e.src].push(i);pairs.add(`${e.src}:${e.dst}`)});
    nodes.forEach((n,i)=>{if(!groups.has(n.cluster))groups.set(n.cluster,[]);groups.get(n.cluster).push(i)});
    const ranked=nodes.map((_,i)=>i).sort((a,b)=>nodes[b].priority-nodes[a].priority||nodes[a].gid.localeCompare(nodes[b].gid));
    const groupIds=[...groups.keys()].sort((a,b)=>a-b),overviewPositions=new Array(nodes.length),clusterBounds=[];
    const circleSizes=groupIds.map(id=>Math.max(28,20+Math.sqrt(groups.get(id).length)*7.6));
    const packingWidth=Math.max(760,Math.sqrt(circleSizes.reduce((a,r)=>a+(2*r+35)**2,0))*1.3);
    let shelfX=30,shelfY=55,shelfHeight=0;
    groupIds.forEach((id,k)=>{
      const r=circleSizes[k],side=2*r+35;
      if(shelfX+side>packingWidth){shelfX=30;shelfY+=shelfHeight;shelfHeight=0}
      const cx=shelfX+r,cy=shelfY+r;clusterBounds.push({id,x:cx,y:cy,r});
      const members=groups.get(id).slice().sort((a,b)=>nodes[b].priority-nodes[a].priority||nodes[a].gid.localeCompare(nodes[b].gid));
      members.forEach((i,j)=>{const angle=j*2.399963229728653,rr=(r-12)*Math.sqrt((j+.25)/members.length);overviewPositions[i]={x:cx+rr*Math.cos(angle),y:cy+rr*Math.sin(angle)}});
      shelfX+=side;shelfHeight=Math.max(shelfHeight,side);
    });
    let positions=overviewPositions,selected=-1,visible=null,labelSet=new Set(),mode='overview',colorBy='role',scale=1,panX=0,panY=0,drag=null;
    const money=x=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(x)+' KZT';
    const number=x=>Number(x).toLocaleString('ru-RU');
    const scientific=x=>Number(x).toPrecision(4);
    const clusterColor=id=>`hsl(${(id*137.508+185)%360} 56% 62%)`;
    const nodeColor=n=>colorBy==='role'?roleColors[n.role]:clusterColor(n.cluster);
    const visibleIndices=()=>visible?[...visible]:nodes.map((_,i)=>i);
    function fitIndices(indices){
      const pts=indices.map(i=>positions[i]);
      if(!pts.length)return;
      const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
      scale=Math.min(2.3,Math.max(100,view.clientWidth-135)/Math.max(100,maxX-minX),Math.max(100,view.clientHeight-180)/Math.max(100,maxY-minY));
      panX=view.clientWidth/2-(minX+maxX)*scale/2;panY=view.clientHeight/2-(minY+maxY)*scale/2-5;draw();
    }
    function radius(i){const screenMinimum=mode==='overview'?1.15:mode==='cluster'?2.6:3.1;return Math.max((i===selected?8:screenMinimum)/scale,i===selected?11:mode==='overview'?2.3:4.8)}
    function drawArrow(e){
      const a=positions[e.src],b=positions[e.dst],active=mode==='neighborhood';
      ctx.strokeStyle=ctx.fillStyle=active?(e.src===selected?'#f3af88':'#86c7e5'):'#658596';
      ctx.globalAlpha=active ? .76 : .28;ctx.lineWidth=(active?1.2:.65)/scale;
      if(e.src===e.dst){const r=radius(e.src)*2;ctx.beginPath();ctx.arc(a.x,a.y-r,r,.25,Math.PI*1.9);ctx.stroke();return}
      const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1,ux=dx/length,uy=dy/length;
      const offset=pairs.has(`${e.dst}:${e.src}`)?15/scale:0;
      const cp={x:(a.x+b.x)/2-uy*offset,y:(a.y+b.y)/2+ux*offset};
      const startR=radius(e.src)+1/scale,endR=radius(e.dst)+2/scale;
      const end={x:b.x-ux*endR,y:b.y-uy*endR};
      ctx.beginPath();ctx.moveTo(a.x+ux*startR,a.y+uy*startR);ctx.quadraticCurveTo(cp.x,cp.y,end.x,end.y);ctx.stroke();
      const angle=Math.atan2(end.y-cp.y,end.x-cp.x),head=(active?6:3.2)/scale;
      ctx.beginPath();ctx.moveTo(end.x,end.y);ctx.lineTo(end.x-head*Math.cos(angle-.5),end.y-head*Math.sin(angle-.5));ctx.lineTo(end.x-head*Math.cos(angle+.5),end.y-head*Math.sin(angle+.5));ctx.closePath();ctx.fill();
    }
    function draw(){
      const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,view.clientWidth,view.clientHeight);ctx.save();ctx.translate(panX,panY);ctx.scale(scale,scale);
      if(mode==='overview'){for(const c of clusterBounds){ctx.strokeStyle='#294654';ctx.globalAlpha=.5;ctx.lineWidth=.6/scale;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,2*Math.PI);ctx.stroke()}}
      for(const e of edges){if(visible&&(!visible.has(e.src)||!visible.has(e.dst)))continue;if(mode==='neighborhood'&&e.src!==selected&&e.dst!==selected)continue;drawArrow(e)}
      for(const i of visibleIndices()){
        const n=nodes[i],p=positions[i];ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,radius(i),0,Math.PI*2);ctx.fillStyle=nodeColor(n);ctx.fill();
        if(i===selected){ctx.strokeStyle='#e6faf8';ctx.lineWidth=2/scale;ctx.stroke()}
        if(mode==='neighborhood'&&labelSet.has(i)){ctx.font=`${i===selected?12:10}px system-ui`;ctx.save();ctx.translate(p.x,p.y);ctx.scale(1/scale,1/scale);ctx.textAlign=i===selected?'center':p.x>=0?'left':'right';ctx.fillStyle=i===selected?'#edf7f9':'#a7becd';ctx.fillText(i===selected?n.gid:'…'+n.gid.slice(-10),i===selected?0:p.x>=0?8:-8,i===selected?-18:4);ctx.restore()}
      }
      ctx.restore();ctx.globalAlpha=1;
    }
    function resize(){const dpr=window.devicePixelRatio||1;canvas.width=Math.round(view.clientWidth*dpr);canvas.height=Math.round(view.clientHeight*dpr);fitIndices(visibleIndices())}
    function add(parent,tag,text,className){const item=document.createElement(tag);if(text!==undefined)item.textContent=text;if(className)item.className=className;parent.appendChild(item);return item}
    function ruleText(n){
      if(n.role==='terminal')return n.truncated_by_depth?'0 исходящих связей и глубина 4: дальнейший обход отсутствует. Терминальная роль не подтверждена.':`0 исходящих связей при ${n.in_deg} плательщиках и глубине ${n.depth}<4. Отсутствие исходящих подтверждается только в этой выгрузке.`;
      if(n.role==='coordinator')return `Плательщики ${n.in_deg} ≥ P75 (${T.in_deg_p75}); получатели ${n.out_deg} ≥ P75 (${T.out_deg_p75}); betweenness ${scientific(n.betweenness)} ≥ P75 положительных значений (${scientific(T.betweenness_p75_positive)}).`;
      if(n.role==='consolidator'&&n.is_seed)return `Для seed: плательщики ${n.in_deg} ≥ P90 (${T.in_deg_p90}); PageRank ${scientific(n.pagerank)} ≥ P75 (${scientific(T.pagerank_p75)}). Неполные входящие исключают правило по доле пересылки.`;
      if(n.role==='consolidator')return `Плательщики ${n.in_deg} ≥ P90 (${T.in_deg_p90}); доля пересылки ${(n.pass_through*100).toFixed(1)}% < 50% наблюдаемого входящего объёма.`;
      if(n.role==='transit')return `Не seed; плательщики ${n.in_deg} ≥ P75 (${T.in_deg_p75}); доля пересылки ${(n.pass_through*100).toFixed(1)}% находится в диапазоне 70–130%.`;
      if(n.role==='distributor')return `Получатели ${n.out_deg} ≥ P90 (${T.out_deg_p90}). Более ранние правила роли не сработали.`;
      return `Ни одно из правил не сработало: ${n.in_deg} плательщиков, ${n.out_deg} получателей. Это отсутствие выраженного сигнала в выборке.`;
    }
    function renderCard(i){
      const n=nodes[i],panel=el('detail');panel.replaceChildren();add(panel,'div','КАРТОЧКА УЗЛА','muted small');add(panel,'h2',n.gid);
      const badges=add(panel,'div',undefined,'badges');add(badges,'span',n.role,'badge');add(badges,'span','Кластер '+n.cluster,'badge');add(badges,'span','Глубина '+n.depth,'badge');if(n.is_seed)add(badges,'span','seed','badge');
      const scores=add(panel,'div',undefined,'scoreline');for(const [value,label] of [[n.priority,'Приоритет'],[n.score,'Сила правила']]){const item=add(scores,'div');add(item,'strong',Number(value).toFixed(3));add(item,'span',label)}
      add(panel,'p',n.evidence,'evidence');const flow=add(panel,'div',undefined,'flow');
      const a=add(flow,'div',undefined,'in');add(a,'span',`Вход · ${n.in_deg} плательщиков`);add(a,'b',money(n.in_kzt));add(a,'span',`${n.in_tx} переводов`);
      const b=add(flow,'div',undefined,'out');add(b,'span',`Выход · ${n.out_deg} получателей`);add(b,'b',money(n.out_kzt));add(b,'span',`${n.out_tx} переводов`);
      if(n.truncated_by_depth)add(panel,'p','Граница глубины 4. Исходящие переводы за этой границей неизвестны.','note');
      if(n.is_seed)add(panel,'p','Входящие seed занижены способом сбора. Доля пересылки для назначения роли не используется.','note');
      const method=add(panel,'details');add(method,'summary','Правило роли и расчёт приоритета');add(method,'p',ruleText(n));
      const table=add(method,'table',undefined,'metrics');const th=add(table,'tr');['Метрика','Ранг','Вес'].forEach(v=>add(th,'th',v));
      for(const [label,key,w] of [['PageRank','pagerank_rank',.30],['Плательщики','in_deg_rank',.25],['Betweenness','betweenness_rank',.25],['Получатели','out_deg_rank',.10],['Близость к seed','seed_reach_rank',.10]]){const row=add(table,'tr');add(row,'td',label);add(row,'td',n[key].toFixed(3));add(row,'td',w.toFixed(2))}
      add(method,'p',`Приоритет — сумма «ранг × вес». В пределах 2 шагов: ${n.seed_reach} seed. PageRank: ${scientific(n.pagerank)}; betweenness: ${scientific(n.betweenness)}. Роли проверяются в порядке из README.`);
      for(const [label,list,isIncoming] of [['Входящие',incoming[i],true],['Исходящие',outgoing[i],false]]){
        const section=add(panel,'details');add(section,'summary',`${label} связи · ${list.length}`);const box=add(section,'div',undefined,'connections');
        if(!list.length)add(box,'p','В этой выгрузке нет связей.','muted small');
        list.slice().sort((a,b)=>edges[b].amount-edges[a].amount).forEach(ei=>{const e=edges[ei],other=isIncoming?e.src:e.dst,button=add(box,'button',undefined,'connection '+(isIncoming?'in':'out'));add(button,'b',(isIncoming?'← ':'→ ')+nodes[other].gid);add(button,'span',`${money(e.amount)} · ${e.n_tx} переводов`);button.onclick=()=>selectNode(other)});
      }
      document.querySelectorAll('.rank').forEach(button=>button.classList.toggle('active',Number(button.dataset.index)===i));
    }
    function selectNode(i){
      selected=i;mode='neighborhood';el('cluster').value='all';el('search').value=nodes[i].gid;el('status').textContent='';
      const neighbors=new Set();[...incoming[i],...outgoing[i]].forEach(ei=>{neighbors.add(edges[ei].src);neighbors.add(edges[ei].dst)});neighbors.delete(i);
      const order=[...neighbors].sort((a,b)=>nodes[b].priority-nodes[a].priority||nodes[a].gid.localeCompare(nodes[b].gid));
      const labelStep=order.length<=30?1:Math.ceil(order.length/16);labelSet=new Set([i,...order.filter((_,k)=>k%labelStep===0)]);
      visible=new Set([i,...order]);positions=overviewPositions.map(p=>({...p}));positions[i]={x:0,y:0};
      const r=Math.max(185,order.length*6.5);order.forEach((j,k)=>{const angle=-Math.PI/2+2*Math.PI*k/Math.max(1,order.length);positions[j]={x:r*Math.cos(angle),y:r*Math.sin(angle)}});
      el('graphTitle').textContent='Прямые связи · '+nodes[i].gid;el('graphSubtitle').textContent=`${neighbors.size} соседей · голубые стрелки: вход · оранжевые: выход · подписи сокращены, полный gid при наведении`;
      canvas.setAttribute('aria-label',`Прямые связи ${nodes[i].gid}: ${incoming[i].length} входящих, ${outgoing[i].length} исходящих`);
      renderCard(i);fitIndices([...visible]);
    }
    function showOverview(clusterId=null){
      selected=-1;positions=overviewPositions;mode=clusterId===null?'overview':'cluster';visible=clusterId===null?null:new Set(groups.get(clusterId));el('search').value='';el('status').textContent='';el('cluster').value=clusterId===null?'all':String(clusterId);
      el('graphTitle').textContent=clusterId===null?'Вся сеть':'Кластер '+clusterId;el('graphSubtitle').textContent=clusterId===null?'Области соответствуют кластерам. Выберите узел или введите gid.':`${visible.size} узлов · показаны внутренние связи кластера`;
      const panel=el('detail');panel.replaceChildren();add(panel,'h2',clusterId===null?'Обзор сети':'Кластер '+clusterId);
      if(clusterId===null)add(panel,'p',`${nodes.length} узлов, ${edges.length} направленных пар, ${groups.size} кластеров. Выберите узел в графе или в списке приоритетов. Результаты кластеризации доступны в clusters.csv.`, 'muted');
      else{const c=data.clusters.find(c=>c.cluster_id===clusterId);add(panel,'p',`${c.n_nodes} узлов · ${c.n_seed} seed · ${money(c.sum_kzt_internal)} внутри кластера`,'muted');add(panel,'p',c.hypothesis,'evidence')}
      document.querySelectorAll('.rank').forEach(button=>button.classList.remove('active'));canvas.setAttribute('aria-label','Направленный граф переводов, '+(visible?visible.size:nodes.length)+' узлов');fitIndices(visibleIndices());
    }
    function search(){const query=el('search').value.trim();if(!query){showOverview();return}const i=gidIndex.get(query);if(i===undefined){el('status').textContent='gid '+query+' не найден в выгрузке';return}selectNode(i)}
    function updateLegend(){const legend=el('legend');legend.replaceChildren();const items=colorBy==='role'?Object.entries(roleColors).map(([role,color])=>[roleNames[role],color]):groupIds.slice(0,6).map(id=>['Кластер '+id,clusterColor(id)]);for(const [label,color] of items){const item=add(legend,'span');const dot=add(item,'i',undefined,'dot');dot.style.background=color;item.append(document.createTextNode(label))}if(colorBy==='cluster')add(legend,'span','… выберите кластер в фильтре')}
    function hitTest(x,y){let best=-1,bestDistance=12;for(const i of visibleIndices()){const p=positions[i],d=Math.hypot(p.x*scale+panX-x,p.y*scale+panY-y);if(d<bestDistance){best=i;bestDistance=d}}return best}
    el('find').onclick=search;el('search').onkeydown=e=>{if(e.key==='Enter')search()};el('overview').onclick=()=>showOverview();
    el('color').onchange=e=>{colorBy=e.target.value;updateLegend();draw()};el('cluster').onchange=e=>showOverview(e.target.value==='all'?null:Number(e.target.value));
    canvas.addEventListener('wheel',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,wx=(mx-panX)/scale,wy=(my-panY)/scale,next=Math.max(.03,Math.min(6,scale*(e.deltaY<0?1.12:.89)));panX=mx-wx*next;panY=my-wy*next;scale=next;draw()},{passive:false});
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);el('tooltip').style.display='none'});
    canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;panX=drag.px+dx;panY=drag.py+dy;draw();return}const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,i=hitTest(x,y),tip=el('tooltip');tip.style.display=i<0?'none':'block';if(i>=0){tip.textContent=nodes[i].gid+'\n'+roleNames[nodes[i].role];tip.style.left=Math.min(x+14,view.clientWidth-190)+'px';tip.style.top=Math.min(y+14,view.clientHeight-60)+'px'}});
    canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;canvas.classList.remove('dragging');if(!moved){const rect=canvas.getBoundingClientRect(),i=hitTest(e.clientX-rect.left,e.clientY-rect.top);if(i>=0)selectNode(i)}});
    canvas.addEventListener('pointerleave',()=>{el('tooltip').style.display='none'});
    groupIds.forEach(id=>{const option=document.createElement('option');option.value=id;option.textContent=`Кластер ${id} · ${groups.get(id).length}`;el('cluster').appendChild(option)});
    ranked.slice(0,10).forEach((i,k)=>{const button=add(el('toplist'),'button',undefined,'rank');button.dataset.index=i;add(button,'span',String(k+1));const text=add(button,'span',nodes[i].gid);add(text,'small',roleNames[nodes[i].role]);add(button,'span',nodes[i].priority.toFixed(3));button.onclick=()=>selectNode(i)});
    el('stats').textContent=`${number(nodes.length)} узлов · ${number(edges.length)} пар · ${groups.size} кластеров`;
    updateLegend();window.addEventListener('resize',resize);resize();if(ranked.length)selectNode(ranked[0]);
  </script>
</body>
</html>
